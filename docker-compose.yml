services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arkex
      POSTGRES_USER: arkex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkex_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkex -d arkex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ARKEX_DATABASE_URL: postgres://arkex:${POSTGRES_PASSWORD:-arkex_dev}@postgres:5432/arkex?sslmode=disable
      ARKEX_SCRATCH_DIR: /tmp/arkex-scratch
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      ARKEX_SANDBOX_NETWORK: ${ARKEX_SANDBOX_NETWORK:-}
      ARKEX_PROXY_ADDR: ${ARKEX_PROXY_ADDR:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scratch:/tmp/arkex-scratch
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  scratch:
