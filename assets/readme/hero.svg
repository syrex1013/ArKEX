<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="ArKex: autonomous penetration testing with a dual-graph audit trail">
  <title>ArKex — autonomous penetration testing that keeps its receipts</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#121024"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6b34db"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#5b6478"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#2a3145"/>

  <!-- title block -->
  <text x="64" y="112" fill="#e6e9f2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="1">ArKex</text>
  <rect x="64" y="130" width="188" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="172" fill="#aeb6c8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="500">Autonomous penetration testing that keeps its receipts</text>
  <text x="64" y="208" fill="#6d7688" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">planner · workers · dual graphs · evidence-bound findings</text>

  <!-- terminal chip -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <rect x="64" y="236" width="380" height="52" rx="8" fill="#0d1119" stroke="#2a3145"/>
    <circle cx="86" cy="262" r="5" fill="#f87171"/><circle cx="102" cy="262" r="5" fill="#fbbf24"/><circle cx="118" cy="262" r="5" fill="#34d399"/>
    <text x="140" y="269" fill="#8ee6b8">$ docker compose up -d --build</text>
  </g>

  <!-- right motif: dual graph with anchors -->
  <g stroke="#2a3145" stroke-width="1.5" fill="none">
    <line x1="820" y1="40" x2="820" y2="286"/>
  </g>
  <!-- exploration chain -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#c7cede">
    <line x1="905" y1="76" x2="985" y2="128" stroke="#5b6478" marker-end="url(#arr)"/>
    <line x1="985" y1="152" x2="905" y2="204" stroke="#5b6478" marker-end="url(#arr)"/>
    <line x1="905" y1="228" x2="985" y2="262" stroke="#8b5cf6" marker-end="url(#arr)"/>
    <rect x="840" y="52" width="76" height="34" rx="8" fill="#161b28" stroke="#3d4a63"/>
    <rect x="972" y="116" width="86" height="34" rx="8" fill="#161b28" stroke="#3d4a63"/>
    <rect x="840" y="196" width="76" height="34" rx="8" fill="#161b28" stroke="#3d4a63"/>
    <rect x="972" y="246" width="92" height="36" rx="8" fill="#231d3d" stroke="#8b5cf6"/>
    <text x="878" y="74" text-anchor="middle">goal</text>
    <text x="1015" y="138" text-anchor="middle">intent</text>
    <text x="878" y="218" text-anchor="middle">fact</text>
    <text x="1018" y="269" text-anchor="middle" fill="#b79bff">finding</text>
  </g>
  <!-- asset tree -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#c7cede">
    <line x1="1128" y1="86" x2="1128" y2="124" stroke="#5b6478" marker-end="url(#arr)"/>
    <line x1="1128" y1="158" x2="1128" y2="196" stroke="#5b6478" marker-end="url(#arr)"/>
    <line x1="1128" y1="230" x2="1128" y2="256" stroke="#5b6478" marker-end="url(#arr)"/>
    <rect x="1086" y="52" width="84" height="34" rx="8" fill="#161b28" stroke="#2f6f5f"/>
    <rect x="1090" y="126" width="76" height="34" rx="8" fill="#161b28" stroke="#2f6f5f"/>
    <rect x="1090" y="198" width="76" height="34" rx="8" fill="#161b28" stroke="#2f6f5f"/>
    <rect x="1086" y="258" width="84" height="34" rx="8" fill="#12241f" stroke="#34d399"/>
    <text x="1128" y="74" text-anchor="middle">root</text>
    <text x="1128" y="148" text-anchor="middle">host</text>
    <text x="1128" y="220" text-anchor="middle">svc</text>
    <text x="1128" y="280" text-anchor="middle" fill="#6ee7b7">endp</text>
  </g>
  <!-- anchor edges -->
  <g stroke="#8b5cf6" stroke-dasharray="4 5" stroke-width="1.5" opacity="0.85">
    <line x1="1060" y1="80" x2="1086" y2="70"/>
    <line x1="905" y1="212" x2="1090" y2="216"/>
    <line x1="1064" y1="266" x2="1086" y2="276"/>
  </g>
  <text x="835" y="34" fill="#6d7688" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18">exploration graph</text>
  <text x="1128" y="34" fill="#6d7688" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" text-anchor="middle">asset graph</text>
  <text x="1040" y="240" fill="#8b5cf6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" text-anchor="end">anchors</text>
</svg>
