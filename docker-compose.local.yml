# Local ArKex override: avoid clashing with a sibling ARTEX stack on :8787.
# Usage:
#   COMPOSE_PROJECT_NAME=arkex-local docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  artex:
    ports: !override
      - "127.0.0.1:8797:8787"
      - "127.0.0.1:8798:8788"
    environment:
      ARTEX_BIND_ADDR: "0.0.0.0"
